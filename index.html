<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recap AI</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:#151c31;padding:18px;border-radius:16px;margin-bottom:16px}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}
input,select,textarea{background:#0d1426;color:white;border:1px solid #34415f}
button{background:#2f7cff;color:white;border:0;font-weight:bold}
textarea{height:220px}
#status{margin-top:12px;padding:10px;background:#0d1426;border-radius:10px}
</style>
</head>

<body>
<div class="container">

<h1>⚽🎬 Recap AI</h1>
<p>Video ထည့် → AI ကြည့် → မြန်မာ Recap ထုတ်</p>

<div class="card">
<label>🎬 Video</label>
<input id="video" type="file" accept="video/*">
<small>အများဆုံး 10 မိနစ်</small>
</div>

<div class="card">
<label>📝 Recap Style</label>
<select id="style">
<option value="football">⚽ Football Recap</option>
<option value="movie">🎬 Movie Recap</option>
<option value="tiktok">📱 TikTok / Shorts Recap</option>
<option value="natural">🗣️ သဘာဝ စကားပြောပုံစံ</option>
</select>
</div>

<div class="card">
<textarea id="recap" placeholder="AI Recap ဒီမှာပေါ်ပါမယ်..."></textarea>
<button id="btn">🤖 AI နဲ့ Recap ထုတ်မယ်</button>
<div id="status"></div>
</div>

</div>

<script>
const video=document.getElementById("video");
const btn=document.getElementById("btn");
const recap=document.getElementById("recap");
const status=document.getElementById("status");

function show(x){status.textContent=x}

video.onchange=()=>{
 const f=video.files[0];
 if(!f)return;

 const v=document.createElement("video");
 v.preload="metadata";

 v.onloadedmetadata=()=>{
   URL.revokeObjectURL(v.src);

   if(v.duration>600){
     video.value="";
     show("❌ Video 10 မိနစ်ထက် မကျော်ရပါ");
   }else{
     show("✅ Video အဆင်ပြေပါတယ်");
   }
 };

 v.src=URL.createObjectURL(f);
};

btn.onclick=async()=>{
 const f=video.files[0];

 if(!f){
   show("❌ Video အရင်ထည့်ပါ");
   return;
 }

 btn.disabled=true;
 show("🤖 AI ပြင်ဆင်နေပါတယ်...");

 try{

   const form=new FormData();
   form.append("video",f);
   form.append("style",document.getElementById("style").value);

   const r=await fetch("/api/gemini",{
     method:"POST",
     body:form
   });

   const text=await r.text();

   let data;
   try{
     data=JSON.parse(text);
   }catch{
     throw new Error(text||"Server Error");
   }

   if(!r.ok) throw new Error(data.error||"AI Error");

   recap.value=data.result||"";
   show("✅ Recap ပြီးပါပြီ");

 }catch(e){
   show("❌ "+e.message);
 }finally{
   btn.disabled=false;
 }
};
</script>

</body>
</html>
