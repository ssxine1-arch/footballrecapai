<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recap AI</title>

<style>
body{
  margin:0;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px
}

.card{
  background:#151c31;
  padding:18px;
  border-radius:16px;
  margin-bottom:16px
}

input,select,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  font-size:16px
}

input,select,textarea{
  background:#0d1426;
  color:white;
  border:1px solid #34415f
}

button{
  background:#2f7cff;
  color:white;
  border:0;
  font-weight:bold
}

button:disabled{
  opacity:.5
}

textarea{
  height:220px
}

#status{
  margin-top:12px;
  padding:10px;
  background:#0d1426;
  border-radius:10px
}
</style>
</head>

<body>

<div class="container">

<h1>⚽🎬 Recap AI</h1>

<p>Video ထည့် → AI ကြည့် → မြန်မာ Recap ထုတ်</p>

<div class="card">

<label>🎬 Video</label>

<input
  id="video"
  type="file"
  accept="video/*"
>

<small>အများဆုံး 10 မိနစ်</small>

</div>

<div class="card">

<label>📝 Recap Style</label>

<select id="style">

<option value="football">
⚽ Football Recap
</option>

<option value="movie">
🎬 Movie Recap
</option>

<option value="tiktok">
📱 TikTok / Shorts Recap
</option>

<option value="natural">
🗣️ သဘာဝ စကားပြောပုံစံ
</option>

</select>

</div>

<div class="card">

<textarea
  id="recap"
  placeholder="AI Recap ဒီမှာပေါ်ပါမယ်..."
></textarea>

<button id="btn">
🤖 AI နဲ့ Recap ထုတ်မယ်
</button>

<div id="status"></div>

</div>

</div>

<script>

const video =
  document.getElementById("video");

const btn =
  document.getElementById("btn");

const recap =
  document.getElementById("recap");

const status =
  document.getElementById("status");


function show(text){
  status.textContent = text;
}


/* =========================
   VIDEO CHECK
========================= */

video.onchange = () => {

  const file = video.files[0];

  if(!file) return;

  const v =
    document.createElement("video");

  v.preload = "metadata";

  v.onloadedmetadata = () => {

    URL.revokeObjectURL(v.src);

    if(v.duration > 600){

      video.value = "";

      show("❌ Video 10 မိနစ်ထက် မကျော်ရပါ");

    }else{

      show(
        "✅ Video အဆင်ပြေပါတယ်"
      );

    }

  };

  v.onerror = () => {

    URL.revokeObjectURL(v.src);

    show("❌ Video ကိုဖတ်မရပါ");

  };

  v.src =
    URL.createObjectURL(file);

};


/* =========================
   AI RECAP
========================= */

btn.onclick = async () => {

  const file =
    video.files[0];

  if(!file){

    show("❌ Video အရင်ထည့်ပါ");

    return;

  }

  btn.disabled = true;
  recap.value = "";

  try{

    /* =========================
       1. CREATE GEMINI SESSION
    ========================= */

    show(
      "📤 Upload ပြင်ဆင်နေပါတယ်..."
    );

    const sessionRes =
      await fetch(
        "/api/upload-session",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            size:file.size,
            mimeType:
              file.type || "video/mp4"
          })
        }
      );


    const sessionText =
      await sessionRes.text();

    let sessionData;

    try{

      sessionData =
        JSON.parse(sessionText);

    }catch{

      throw new Error(
        sessionText ||
        "Upload session error"
      );

    }


    if(!sessionRes.ok){

      throw new Error(
        sessionData.error ||
        "Upload session မရပါ"
      );

    }


    const uploadUrl =
      sessionData.uploadUrl;


    if(!uploadUrl){

      throw new Error(
        "Gemini upload URL မရပါ"
      );

    }


    /* =========================
       2. UPLOAD VIDEO
    ========================= */

    const CHUNK_SIZE =
      8 * 1024 * 1024;

    let offset = 0;
    let fileInfo = null;


    while(offset < file.size){

      const end =
        Math.min(
          offset + CHUNK_SIZE,
          file.size
        );

      const chunk =
        file.slice(
          offset,
          end
        );

      const isLast =
        end >= file.size;


      const percent =
        Math.round(
          (end / file.size) * 100
        );


      show(
        "📤 Video တင်နေပါတယ်... " +
        percent +
        "%"
      );


      /*
        IMPORTANT:
        Gemini upload URL ကို
        browser က တိုက်ရိုက် fetch မလုပ်နိုင်
        ဖြစ်နိုင်တာကြောင့် XMLHttpRequest သုံးထားပါတယ်။
      */

      const result =
        await uploadChunk(
          uploadUrl,
          chunk,
          offset,
          isLast
        );


      if(!result.ok){

        throw new Error(
          result.error ||
          "Gemini Video Upload မအောင်မြင်ပါ"
        );

      }


      if(isLast){

        fileInfo =
          result.data;

      }


      offset = end;

    }


    /* =========================
       3. FILE URI
    ========================= */

    const fileUri =
      fileInfo?.file?.uri ||
      fileInfo?.uri;


    const mimeType =
      fileInfo?.file?.mimeType ||
      fileInfo?.mimeType ||
      file.type ||
      "video/mp4";


    if(!fileUri){

      throw new Error(
        "Gemini File URI မရပါ"
      );

    }


    /* =========================
       4. AI RECAP
    ========================= */

    show(
      "🤖 AI က Video ကို ကြည့်နေပါတယ်..."
    );


    const aiRes =
      await fetch(
        "/api/gemini",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            fileUri:fileUri,

            mimeType:mimeType,

            style:
              document.getElementById(
                "style"
              ).value

          })

        }
      );


    const aiText =
      await aiRes.text();


    let aiData;

    try{

      aiData =
        JSON.parse(aiText);

    }catch{

      throw new Error(
        aiText ||
        "AI response error"
      );

    }


    if(!aiRes.ok){

      throw new Error(
        aiData.error ||
        "Gemini Error"
      );

    }


    recap.value =
      aiData.text || "";


    if(!recap.value){

      throw new Error(
        "AI က Recap စာသားမပြန်ပေးပါ"
      );

    }


    show(
      "✅ Recap ပြီးပါပြီ"
    );


  }catch(error){

    console.error(error);

    show(
      "❌ " +
      (
        error.message ||
        "တစ်ခုခုမှားယွင်းနေပါတယ်"
      )
    );


  }finally{

    btn.disabled = false;

  }

};


/* =========================
   GEMINI CHUNK UPLOAD
========================= */

function uploadChunk(
  uploadUrl,
  chunk,
  offset,
  isLast
){

  return new Promise((resolve) => {

    const xhr =
      new XMLHttpRequest();

    xhr.open(
      "POST",
      uploadUrl,
      true
    );


    xhr.setRequestHeader(
      "X-Goog-Upload-Offset",
      String(offset)
    );


    xhr.setRequestHeader(
      "X-Goog-Upload-Command",
      isLast
        ? "upload, finalize"
        : "upload"
    );


    xhr.onload = () => {

      let data = null;

      try{

        data =
          JSON.parse(
            xhr.responseText
          );

      }catch{

        data = null;

      }


      if(
        xhr.status >= 200 &&
        xhr.status < 300
      ){

        resolve({
          ok:true,
          data:data
        });

      }else{

        resolve({
          ok:false,
          error:
            data?.error ||
            xhr.responseText ||
            "Upload failed"
        });

      }

    };


    xhr.onerror = () => {

      resolve({
        ok:false,
        error:
          "Browser က Gemini upload server ကို ချိတ်မရပါ"
      });

    };


    xhr.ontimeout = () => {

      resolve({
        ok:false,
        error:
          "Upload timeout ဖြစ်သွားပါတယ်"
      });

    };


    xhr.timeout =
      120000;


    xhr.send(chunk);

  });

}

</script>

</body>
</html>
