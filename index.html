<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Recap AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:system-ui,"Noto Sans Myanmar",sans-serif
}
.container{
  max-width:720px;
  margin:auto;
  padding:20px
}
.card{
  background:#151c31;
  border:1px solid #293451;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px
}
h1{margin:0 0 8px}
.sub{color:#aeb7d0}
label{
  display:block;
  font-weight:700;
  margin-bottom:8px
}
input,select,textarea,button{
  width:100%;
  font:inherit;
  border-radius:12px
}
input,select,textarea{
  background:#0d1426;
  color:#fff;
  border:1px solid #34415f;
  padding:12px
}
textarea{
  min-height:220px;
  resize:vertical
}
button{
  border:0;
  padding:14px;
  margin-top:12px;
  background:#2f7cff;
  color:#fff;
  font-weight:800
}
button:disabled{opacity:.6}
.status{
  display:none;
  background:#0d1426;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  line-height:1.6
}
small{color:#8f9ab7}
</style>
</head>

<body>

<div class="container">

<h1>⚽🎬 Recap AI</h1>

<p class="sub">
Video ထည့် → AI ကြည့် → မြန်မာ Recap ထုတ်
</p>

<div class="card">

<label>🎬 Video</label>

<input
  id="videoFile"
  type="file"
  accept="video/*"
>

<small>
အများဆုံး 10 မိနစ်
</small>

</div>

<div class="card">

<label>📝 Recap Style</label>

<select id="style">
  <option value="football">
    ⚽ Football Recap
  </option>

  <option value="movie">
    🎬 Movie Recap
  </option>

  <option value="tiktok">
    📱 TikTok / Shorts Recap
  </option>

  <option value="natural">
    🗣️ သဘာဝ စကားပြောပုံစံ
  </option>
</select>

</div>

<div class="card">

<label>📝 မြန်မာ Recap</label>

<textarea
  id="recap"
  placeholder="Video ထည့်ပြီး AI ခလုတ်နှိပ်ပါ..."
></textarea>

<button id="aiBtn">
🤖 AI နဲ့ Recap ထုတ်မယ်
</button>

<div id="status" class="status"></div>

</div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

function status(message){

  $("status").style.display = "block";

  $("status").textContent = message;
}


/* VIDEO CHECK */

$("videoFile").addEventListener(
  "change",
  e => {

    const file =
      e.target.files[0];

    if(!file) return;

    const video =
      document.createElement("video");

    video.preload = "metadata";

    video.onloadedmetadata = () => {

      URL.revokeObjectURL(
        video.src
      );

      if(video.duration > 600){

        status(
          "❌ Video က 10 မိနစ်ထက် မကျော်ရပါ။"
        );

        $("videoFile").value = "";

        return;
      }

      status(
        "✅ Video အဆင်ပြေပါတယ်။"
      );

    };

    video.onerror = () => {

      status(
        "❌ Video ဖတ်မရပါ။"
      );

    };

    video.src =
      URL.createObjectURL(file);

  }
);


/* AI RECAP */

$("aiBtn").addEventListener(
  "click",
  async () => {

    const file =
      $("videoFile").files[0];

    if(!file){

      status(
        "❌ အရင်ဆုံး Video ထည့်ပါ။"
      );

      return;
    }

    $("aiBtn").disabled = true;

    status(
      "🤖 Video ကို AI ဆီပို့နေပါတယ်..."
    );

    try{

      const base64 =
        await new Promise(
          (resolve,reject) => {

            const reader =
              new FileReader();

            reader.onload = () => {

              const result =
                reader.result;

              const comma =
                result.indexOf(",");

              resolve(
                result.substring(
                  comma + 1
                )
              );

            };

            reader.onerror =
              () =>
                reject(
                  new Error(
                    "Video ဖတ်မရပါ"
                  )
                );

            reader.readAsDataURL(
              file
            );

          }
        );


      status(
        "🤖 Gemini က Video ကိုကြည့်ပြီး Recap ရေးနေပါတယ်..."
