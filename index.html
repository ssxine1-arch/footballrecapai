<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recap AI</title>

<style>
body{
  margin:0;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px
}

.card{
  background:#151c31;
  padding:18px;
  border-radius:16px;
  margin-bottom:16px
}

input,select,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  font-size:16px
}

input,select,textarea{
  background:#0d1426;
  color:white;
  border:1px solid #34415f
}

button{
  background:#2f7cff;
  color:white;
  border:0;
  font-weight:bold
}

button:disabled{
  opacity:.5
}

textarea{
  height:220px
}

#status{
  margin-top:12px;
  padding:10px;
  background:#0d1426;
  border-radius:10px
}
</style>
</head>

<body>

<div class="container">

<h1>⚽🎬 Recap AI</h1>

<p>Video ထည့် → AI ကြည့် → မြန်မာ Recap ထုတ်</p>

<div class="card">

<label>🎬 Video</label>

<input
  id="video"
  type="file"
  accept="video/*"
>

<small>အများဆုံး 10 မိနစ်</small>

</div>

<div class="card">

<label>📝 Recap Style</label>

<select id="style">

<option value="football">
⚽ Football Recap
</option>

<option value="movie">
🎬 Movie Recap
</option>

<option value="tiktok">
📱 TikTok / Shorts Recap
</option>

<option value="natural">
🗣️ သဘာဝ စကားပြောပုံစံ
</option>

</select>

</div>

<div class="card">

<textarea
  id="recap"
  placeholder="AI Recap ဒီမှာပေါ်ပါမယ်..."
></textarea>

<button id="btn">
🤖 AI နဲ့ Recap ထုတ်မယ်
</button>

<div id="status"></div>

</div>

</div>

<script>

const video = document.getElementById("video");
const btn = document.getElementById("btn");
const recap = document.getElementById("recap");
const status = document.getElementById("status");

function show(text){
  status.textContent = text;
}


/* =========================
   VIDEO DURATION CHECK
========================= */

video.onchange = () => {

  const file = video.files[0];

  if(!file) return;

  const v = document.createElement("video");

  v.preload = "metadata";

  v.onloadedmetadata = () => {

    URL.revokeObjectURL(v.src);

    if(v.duration > 600){

      video.value = "";

      show("❌ Video 10 မိနစ်ထက် မကျော်ရပါ");

    }else{

      show(
        "✅ Video အဆင်ပြေပါတယ် — AI Recap ထုတ်နိုင်ပါပြီ"
      );

    }

  };

  v.src = URL.createObjectURL(file);

};


/* =========================
   AI RECAP
========================= */

btn.onclick = async () => {

  const file = video.files[0];

  if(!file){

    show("❌ Video အရင်ထည့်ပါ");

    return;

  }

  btn.disabled = true;
  recap.value = "";

  try{

    /* =========================
       1. UPLOAD SESSION
    ========================= */

    show("📤 Upload ပြင်ဆင်နေပါတယ်...");

    const sessionRes = await fetch(
      "/api/upload-session",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          size:file.size,
          mimeType:file.type
        })
      }
    );

    const sessionText =
      await sessionRes.text();

    let sessionData;

    try{

      sessionData =
        JSON.parse(sessionText);

    }catch{

      throw new Error(
        sessionText ||
        "Upload session error"
      );

    }

    if(!sessionRes.ok){

      throw new Error(
        sessionData.error ||
        "Upload session မရပါ"
      );

    }

    const uploadUrl =
      sessionData.uploadUrl;

    if(!uploadUrl){

      throw new Error(
        "Gemini upload URL မရပါ"
      );

    }


    /* =========================
       2. CHUNK UPLOAD
    ========================= */

    const CHUNK_SIZE =
      3 * 1024 * 1024;

    let offset = 0;

    while(offset < file.size){

      const end =
        Math.min(
          offset + CHUNK_SIZE,
          file.size
        );

      const chunk =
        file.slice(offset, end);

      const isLast =
        end >= file.size;

      const percent =
        Math.round(
          (end / file.size) * 100
        );

      show(
        "📤 Video တင်နေပါတယ်... " +
        percent +
        "%"
      );

      const chunkRes =
        await fetch(
          "/api/upload-chunk",
          {
            method:"POST",

            headers:{
              "X-Upload-Url":
                uploadUrl,

              "X-Upload-Offset":
                String(offset),

              "X-Upload-Command":
                isLast
                  ? "upload, finalize"
                  : "upload"
            },

            body:chunk
          }
        );

      const chunkText =
        await chunkRes.text();

      let chunkData;

      try{

        chunkData =
          JSON.parse(chunkText);

      }catch{

        throw new Error(
          chunkText ||
          "Chunk upload error"
        );

      }

      if(!chunkRes.ok){

        throw new Error(
          chunkData.error ||
          "Video upload မအောင်မြင်ပါ"
        );

      }

      if(isLast){

        const fileInfo =
          chunkData.file ||
          chunkData;

        const fileUri =
          fileInfo.uri;

        const mimeType =
          fileInfo.mimeType ||
          file.type;

        if(!fileUri){

          throw new Error(
            "Gemini File URI မရပါ"
          );

        }


        /* =========================
           3. GEMINI RECAP
        ========================= */

        show(
          "🤖 AI က Video ကို ကြည့်ပြီး Recap ရေးနေပါတယ်..."
        );

        const aiRes =
          await fetch(
            "/api/gemini",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({

                fileUri:
                  fileUri,

                mimeType:
                  mimeType,

                style:
                  document.getElementById(
                    "style"
                  ).value

              })
            }
          );

        const aiText =
          await aiRes.text();

        let aiData;

        try{

          aiData =
            JSON.parse(aiText);

        }catch{

          throw new Error(
            aiText ||
            "AI response error"
          );

        }

        if(!aiRes.ok){

          throw new Error(
            aiData.error ||
            "Gemini Error"
          );

        }

        recap.value =
          aiData.text || "";

        if(!recap.value){

          throw new Error(
            "AI က Recap စာသားမပြန်ပေးပါ"
          );

        }

        show(
          "✅ Recap ပြီးပါပြီ"
        );

      }

      offset = end;

    }

  }catch(error){

    console.error(error);

    show(
      "❌ " +
      error.message
    );

  }finally{

    btn.disabled = false;

  }

};

</script>

</body>
</html>
