<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Recap AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,"Noto Sans Myanmar",sans-serif}
.container{max-width:720px;margin:auto;padding:20px}
h1{margin:0 0 6px}
.sub{color:#aeb7d0;margin-bottom:20px}
.card{background:#151c31;border:1px solid #293451;border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:8px}
textarea,input,select,button{width:100%;font:inherit;border-radius:12px}
textarea,input,select{background:#0d1426;color:#fff;border:1px solid #34415f;padding:12px}
textarea{min-height:190px}
input[type=file]{padding:10px}
button{border:0;padding:14px;margin-top:12px;background:#2f7cff;color:#fff;font-weight:800}
.secondary{background:#27324d}
.status{display:none;background:#0d1426;padding:12px;border-radius:12px;margin-top:12px}
.result{display:none;white-space:pre-wrap;line-height:1.8;background:#0d1426;padding:14px;border-radius:12px;margin-top:12px}
small{color:#8f9ab7}
</style>
</head>

<body>
<div class="container">

<h1>⚽ Football Recap AI</h1>
<p class="sub">ဗီဒီယိုထည့် → မြန်မာ Recap ထုတ် → အသံနဲ့ဖတ်</p>

<div class="card">
<label>🎬 Video Upload</label>
<input id="videoFile" type="file" accept="video/*">
<small>အများဆုံး 10 မိနစ်</small>
</div>

<div class="card">
<label>📝 Recap စာသား</label>
<textarea id="recap" placeholder="ဒီမှာ ဘောလုံးသတင်း / အကြောင်းအရာ ထည့်ပါ..."></textarea>

<button id="aiBtn">🤖 AI နဲ့ မြန်မာ Recap ထုတ်မယ်</button>
<button id="speakBtn" class="secondary">🔊 မြန်မာအသံနဲ့ ဖတ်မယ်</button>

<div id="status" class="status"></div>
<div id="result" class="result"></div>
</div>

<div class="card">
<label>🎙️ ကိုယ့်အသံနမူနာ</label>
<input id="voiceFile" type="file" accept="audio/*">
<small>အသံနမူနာကို နောက်တစ်ဆင့်မှာ Voice AI နဲ့ ချိတ်ပေးမယ်။</small>
</div>

</div>

<script>
const $=id=>document.getElementById(id);

function status(msg){
  $("status").style.display="block";
  $("status").textContent=msg;
}

$("videoFile").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;

  const max=10*60*1000;

  if(file.size>500*1024*1024){
    status("Video ဖိုင်က အရမ်းကြီးပါတယ်။");
    e.target.value="";
    return;
  }

  const video=document.createElement("video");
  video.preload="metadata";

  video.onloadedmetadata=()=>{
    URL.revokeObjectURL(video.src);

    if(video.duration>600){
      status("❌ Video က 10 မိနစ်ထက် မကျော်ရပါ။");
      $("videoFile").value="";
    }else{
      status("✅ Video အဆင်ပြေပါတယ်။");
    }
  };

  video.src=URL.createObjectURL(file);
});

$("aiBtn").addEventListener("click",async()=>{
  const text=$("recap").value.trim();

  if(!text){
    status("အရင်ဆုံး ဘောလုံးအကြောင်းအရာ ထည့်ပါ။");
    return;
  }

  $("aiBtn").disabled=true;
  status("🤖 Gemini က မြန်မာ Recap ရေးနေပါတယ်...");

  try{
    const response=await fetch("/api/gemini",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({text})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"AI Error");
    }

    $("recap").value=data.result;
    $("result").style.display="block";
    $("result").textContent="✅ Recap ပြီးပါပြီ";
    status("✅ မြန်မာ Recap ထုတ်ပြီးပါပြီ။");

  }catch(error){
    status("❌ "+error.message);
  }finally{
    $("aiBtn").disabled=false;
  }
});

$("speakBtn").addEventListener("click",()=>{
  const text=$("recap").value.trim();

  if(!text){
    status("အရင်ဆုံး Recap စာသားထည့်ပါ။");
    return;
  }

  if(!("speechSynthesis" in window)){
    status("ဒီ browser မှာ အသံဖတ်စနစ် မရပါ။");
    return;
  }

  speechSynthesis.cancel();

  const voice=new SpeechSynthesisUtterance(text);
  voice.lang="my-MM";
  voice.rate=0.92;
  voice.pitch=1;

  speechSynthesis.speak(voice);
  status("🔊 အသံဖတ်နေပါတယ်...");
});
</script>

</body>
</html>
